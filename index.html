<style>

/* =========================
   INTRO SCREEN
========================= */

.intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    /* PURPLE — same main website vibe */
    background:
    radial-gradient(
        circle at 75% 50%,
        #8f7ff5 0%,
        #6556d8 30%,
        #39339a 55%,
        #17164f 78%,
        #080820 100%
    );

    overflow:hidden;

    /* AFTER EVERYTHING APPEARS → FADE OUT */
    animation:introFadeOut 1.2s ease 8.5s forwards;
}


/* =========================
   GREEN DNA
========================= */

.dna{
    position:absolute;

    width:220px;
    height:430px;

    left:50%;
    top:43%;

    transform:translate(-50%,-50%) scale(.7);

    animation:
    dnaPop .8s 2.2s
    cubic-bezier(.2,1.4,.3,1)
    forwards;
}


/* GREEN GLOWING STRANDS */

.strand{
    position:absolute;

    top:10px;

    width:7px;
    height:400px;

    border-radius:20px;

    background:#39ff88;

    box-shadow:
    0 0 8px #39ff88,
    0 0 20px #00ff66,
    0 0 40px #00cc55;
}


.strand-left{
    left:45px;

    transform:
    rotate(-15deg)
    translateX(-150px);

    opacity:0;

    animation:
    leftDNA 1.5s
    cubic-bezier(.2,.8,.2,1)
    .1s forwards;
}


.strand-right{
    right:45px;

    transform:
    rotate(15deg)
    translateX(150px);

    opacity:0;

    animation:
    rightDNA 1.5s
    cubic-bezier(.2,.8,.2,1)
    .1s forwards;
}


/* GREEN DNA RUNG */

.rung{
    position:absolute;

    left:50%;

    height:5px;

    border-radius:20px;

    background:#39ff88;

    box-shadow:
    0 0 8px #39ff88,
    0 0 20px #00ff66;

    opacity:0;

    transform-origin:center;

    animation:
    rungAppear .25s ease forwards;
}


/* DNA BARS */

.r1{top:20px;width:45px;margin-left:-22px;animation-delay:.65s}
.r2{top:52px;width:58px;margin-left:-29px;animation-delay:.75s}
.r3{top:84px;width:70px;margin-left:-35px;animation-delay:.85s}
.r4{top:116px;width:82px;margin-left:-41px;animation-delay:.95s}
.r5{top:148px;width:94px;margin-left:-47px;animation-delay:1.05s}
.r6{top:180px;width:106px;margin-left:-53px;animation-delay:1.15s}
.r7{top:212px;width:118px;margin-left:-59px;animation-delay:1.25s}
.r8{top:244px;width:130px;margin-left:-65px;animation-delay:1.35s}
.r9{top:276px;width:142px;margin-left:-71px;animation-delay:1.45s}
.r10{top:308px;width:154px;margin-left:-77px;animation-delay:1.55s}
.r11{top:340px;width:166px;margin-left:-83px;animation-delay:1.65s}
.r12{top:372px;width:178px;margin-left:-89px;animation-delay:1.75s}


/* =========================
   DNA ANIMATION
========================= */

@keyframes leftDNA{

    0%{
        transform:
        rotate(-15deg)
        translateX(-150px);
        opacity:0;
    }

    70%{
        opacity:1;
    }

    100%{
        transform:
        rotate(-15deg)
        translateX(0);
        opacity:1;
    }
}


@keyframes rightDNA{

    0%{
        transform:
        rotate(15deg)
        translateX(150px);
        opacity:0;
    }

    70%{
        opacity:1;
    }

    100%{
        transform:
        rotate(15deg)
        translateX(0);
        opacity:1;
    }
}


@keyframes rungAppear{

    0%{
        opacity:0;
        transform:scaleX(0);
    }

    100%{
        opacity:1;
        transform:scaleX(1);
    }
}


@keyframes dnaPop{

    0%{
        transform:
        translate(-50%,-50%)
        scale(.7);
    }

    65%{
        transform:
        translate(-50%,-50%)
        scale(1.12);
    }

    100%{
        transform:
        translate(-50%,-50%)
        scale(1);
    }
}


/* =========================
   INTRO TEXT
========================= */

.intro-text{
    position:absolute;

    top:72%;

    width:100%;

    text-align:center;
}


/* TEXT POPS IN */

.technology,
.name,
.biotech{

    opacity:0;

    transform:translateY(20px) scale(.95);

    animation:
    textAppear .8s ease forwards;
}


.technology{
    color:#39ff88;

    font-size:13px;

    letter-spacing:7px;

    animation-delay:3.5s;
}


.name{
    margin-top:18px;

    font-size:clamp(24px,5vw,46px);

    font-weight:bold;

    letter-spacing:3px;

    animation-delay:4.5s;
}


.biotech{
    margin-top:16px;

    color:#c992ff;

    font-size:25px;

    letter-spacing:5px;

    animation-delay:5.5s;
}


.biotech span{
    color:#64eaff;
}


@keyframes textAppear{

    0%{
        opacity:0;
        transform:translateY(20px) scale(.95);
    }

    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   INTRO → MAIN PAGE
========================= */

@keyframes introFadeOut{

    0%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

</style>
